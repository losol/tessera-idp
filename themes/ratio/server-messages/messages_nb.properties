#
# Appended to Keycloak's Norwegian bundle (messages_no) to form messages_nb at
# build time (see postBuild in vite.config.ts). Keys here win over messages_no.
# Covers server-rendered error messages the Norwegian bundle lacks, which
# otherwise fall back to English on an nb realm. Non-ASCII as \u escapes,
# like the bundles Keycloak ships.

cookieNotFoundMessage=Innloggingen kunne ikke fortsette. Den kan ha utl\u00f8pt, eller nettleseren blokkerer informasjonskapsler. G\u00e5 tilbake til tjenesten og pr\u00f8v igjen.
expiredActionMessage=Handlingen har utl\u00f8pt. Fortsett med innloggingen n\u00e5.
pageNotFound=Fant ikke siden
internalServerError=Det oppstod en intern feil
