# Builds and publishes the image for a release tag, then fills in the GitHub
# Release:
#
#   v0.1.0 -> ghcr.io/losol/tessera-idp:0.1.0, :0.1, :latest   (linux/amd64 + linux/arm64)
#          -> https://github.com/losol/tessera-idp/releases/tag/v0.1.0
#
# Normally the tag and the Release come from release-please
# (.github/workflows/release-please.yml), which then starts this workflow on
# the tag: a tag pushed with the workflow token does not trigger `on: push`
# by itself. A tag pushed by hand (`git push origin v0.1.0`) still works and
# creates the Release here.
#
# Actions are pinned to commit SHAs (with the version in a trailing comment);
# Dependabot keeps the pins updated (.github/dependabot.yml).
name: Build & publish image

on:
  push:
    tags: ["v*"]
  # Run on a tag ref: `gh workflow run build.yml --ref v0.1.0`.
  workflow_dispatch:

# Don't cancel a publish midway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  packages: write # push to GHCR via GITHUB_TOKEN

env:
  IMAGE: ghcr.io/losol/tessera-idp

jobs:
  release:
    name: Build & push (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cheap insurance: never publish an image whose compile/runtime Keycloak
      # versions disagree.
      - name: Keycloak version guard
        run: scripts/check-keycloak-version.sh

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.2.0 — arm64 emulation
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives tags/labels from the git tag. `latest` is added automatically for
      # a (non-prerelease) semver tag via the default flavor=latest=auto.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Last, so a failed build never adds the facts below to a Release.
      # Two facts the Release cannot know by itself go at the top of its body:
      # which Keycloak is baked in, and the digest to pin against. A Release
      # release-please made keeps its changelog under them; a hand-pushed tag
      # gets a Release here, with GitHub's notes from the merged PRs (grouped
      # per .github/release.yml).
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case "$TAG" in v*) ;; *) echo "not a release tag: $TAG" >&2; exit 1 ;; esac
          kc="$(scripts/check-keycloak-version.sh --print)"
          facts="$(printf "Keycloak **%s**\n\n\`\`\`\n%s@%s\n\`\`\`\n" "$kc" "$IMAGE" "$DIGEST")"
          # A semver prerelease (v0.1.0-rc.1) must not become the "Latest" release.
          prerelease=(); case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          if body="$(gh release view "$TAG" --json body --jq .body 2>/dev/null)"; then
            gh release edit "$TAG" "${prerelease[@]}" --notes "$(printf '%s\n%s' "$facts" "$body")"
          else
            gh release create "$TAG" --verify-tag --generate-notes "${prerelease[@]}" --notes "$facts"
          fi
