# Tag-driven release. Push a semver tag and this builds and publishes the image:
#
#   git tag v1.0.0 && git push origin v1.0.0
#   -> ghcr.io/losol/tessera-idp:1.0.0, :1.0, :latest   (linux/amd64 + linux/arm64)
#
# Actions are pinned to commit SHAs (with the version in a trailing comment);
# Dependabot keeps the pins updated (.github/dependabot.yml).
name: Build & publish image

on:
  push:
    tags: ["v*"]

# Don't cancel a publish midway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push to GHCR via GITHUB_TOKEN

env:
  IMAGE: ghcr.io/losol/tessera-idp

jobs:
  release:
    name: Build & push (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Cheap insurance: never publish an image whose compile/runtime Keycloak
      # versions disagree.
      - name: Keycloak version guard
        run: scripts/check-keycloak-version.sh

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v3.7.0 — arm64 emulation
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives tags/labels from the git tag. `latest` is added automatically for
      # a (non-prerelease) semver tag via the default flavor=latest=auto.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
