# Tag-driven release. Push a semver tag and this builds and publishes the image,
# then opens the matching GitHub Release:
#
#   git tag v0.1.0 && git push origin v0.1.0
#   -> ghcr.io/losol/tessera-idp:0.1.0, :0.1, :latest   (linux/amd64 + linux/arm64)
#   -> https://github.com/losol/tessera-idp/releases/tag/v0.1.0
#
# Actions are pinned to commit SHAs (with the version in a trailing comment);
# Dependabot keeps the pins updated (.github/dependabot.yml).
name: Build & publish image

on:
  push:
    tags: ["v*"]

# Don't cancel a publish midway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  packages: write # push to GHCR via GITHUB_TOKEN

env:
  IMAGE: ghcr.io/losol/tessera-idp

jobs:
  release:
    name: Build & push (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cheap insurance: never publish an image whose compile/runtime Keycloak
      # versions disagree.
      - name: Keycloak version guard
        run: scripts/check-keycloak-version.sh

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0 — arm64 emulation
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives tags/labels from the git tag. `latest` is added automatically for
      # a (non-prerelease) semver tag via the default flavor=latest=auto.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Last, so a failed build never leaves a Release pointing at nothing.
      # GitHub writes the body from merged PRs (grouped per .github/release.yml);
      # --notes prepends the two facts it cannot know: which Keycloak is baked in,
      # and the digest to pin against.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          kc="$(scripts/check-keycloak-version.sh --print)"
          args=(--verify-tag --generate-notes)
          # A semver prerelease (v0.1.0-rc.1) must not become the "Latest" release.
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          gh release create "$TAG" "${args[@]}" --notes "$(
            printf "Keycloak **%s**\n\n\`\`\`\n%s@%s\n\`\`\`\n" "$kc" "$IMAGE" "$DIGEST"
          )"
