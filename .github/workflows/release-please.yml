# Keeps one release PR open on main with the next version and the changelog,
# worked out from the commit messages (conventional commits; the PR titles,
# since PRs are squash-merged). Merging that PR is the release: this creates
# the tag and the GitHub Release, then starts the build on the tag. The
# explicit start is needed because a tag pushed with the workflow token does
# not trigger build.yml's `on: push` by itself.
#
# Versions, sections and the commit types are in release-please-config.json;
# the version counted from is in .release-please-manifest.json.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # tags and the Release
  pull-requests: write # the release PR
  actions: write # start build.yml on the tag

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release

      - name: Build & publish the release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
