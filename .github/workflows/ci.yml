name: CI

on:
  pull_request:
  push:
    branches: [main]

# Newer pushes to the same ref supersede in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Keycloak version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versions must match across Dockerfile and pom.xml
        run: scripts/check-keycloak-version.sh

  plugin:
    name: Plugin — mvn package (runs AltchaAndroidJsonTest)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # package = shade + tests; the same command the Dockerfile plugin stage runs.
      - name: Build & test provider JAR
        working-directory: plugins/tessera-otp
        run: mvn -B package

  theme:
    name: Theme — keycloakify build
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # keycloakify packages the theme JAR with Maven, so a JDK must be present.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: themes/ratio/package-lock.json
      - name: Build theme JAR
        working-directory: themes/ratio
        run: |
          npm ci
          npm run build-keycloak-theme

  image:
    name: Image — docker build (no push)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # End-to-end: bakes both providers and runs `kc.sh build`. amd64 only here
      # to keep PRs fast; the arm64 build is exercised by build.yml on release.
      - name: Build optimized image (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: tessera-idp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
