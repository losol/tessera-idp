name: CI

on:
  pull_request:
  push:
    branches: [main]

# Newer pushes to the same ref supersede in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Keycloak version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Versions must match across Dockerfile and pom.xml
        run: scripts/check-keycloak-version.sh

  plugin:
    name: Plugin — mvn package (runs AltchaAndroidJsonTest)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # package = shade + tests; the same command the Dockerfile plugin stage runs.
      - name: Build & test provider JAR
        working-directory: plugins/tessera-otp
        run: mvn -B package

  theme:
    name: Theme — keycloakify build
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # keycloakify packages the theme JAR with Maven, so a JDK must be present.
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: themes/ratio/package-lock.json
      - name: Build theme JAR
        working-directory: themes/ratio
        run: |
          npm ci
          npm run build-keycloak-theme

  image:
    name: Image — docker build (no push)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # End-to-end: bakes both providers and runs `kc.sh build`. amd64 only here
      # to keep PRs fast; the arm64 build is exercised by build.yml on release.
      - name: Build optimized image (amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: tessera-idp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
