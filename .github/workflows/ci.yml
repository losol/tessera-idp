name: CI

on:
  pull_request:
  push:
    branches: [main]

# Newer pushes to the same ref supersede in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Keycloak version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Versions must match across Dockerfile and pom.xml
        run: scripts/check-keycloak-version.sh

  plugin:
    name: Plugin — mvn package (runs AltchaAndroidJsonTest)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # package = shade + tests; the same command the Dockerfile plugin stage runs.
      - name: Build & test provider JAR
        working-directory: plugins/tessera-otp
        run: mvn -B package

  theme:
    name: Theme — keycloakify build
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # keycloakify packages the theme JAR with Maven, so a JDK must be present.
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: themes/ratio/package-lock.json
      - name: Build theme JAR
        working-directory: themes/ratio
        run: |
          npm ci
          npm run build-keycloak-theme

  image:
    name: Image — docker build (no push)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # End-to-end: bakes both providers and runs `kc.sh build`. amd64 only here
      # to keep PRs fast; the arm64 build is exercised by build.yml on release.
      - name: Build optimized image (amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: tessera-idp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
